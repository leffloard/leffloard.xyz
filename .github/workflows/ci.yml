name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # mongodb-memory-server keeps its MongoDB download here, so the cache below can restore it.
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.data/mongodb-binaries

jobs:
  checks:
    name: Checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .data/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows:
    name: Windows build and tests
    # Production runs on a Windows server.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .data/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      # The deploy scripts, in the Windows PowerShell 5.1 the server has.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\tests\common.tests.ps1

  legacy:
    name: v1 backend tests
    # Runs until the v1 backend is removed; its tests are the spec for the v2 intake.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
